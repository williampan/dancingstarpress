  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      min-height: 100vh;
      padding: 48px 24px;
    }

    .content {
      max-width: 480px;
      margin: 0 auto;
    }

    .logo {
      display: block;
      width: 70px;
      margin: 0 auto 36px;
    }

    .headline {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 400;
      color: #FF0000;
      text-transform: uppercase;
      font-size: clamp(34px, 10vw, 56px);
      line-height: 0.88;
      margin-bottom: 14px;
    }

    .gap { height: 20px; }

    .blue {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 300;
      color: #2f73f7;
      font-size: clamp(16px, 5vw, 24px);
      line-height: 1.3;
      margin-top: 8px;
    }

    .blue a {
      color: inherit;
      text-decoration: none;
    }

    .signup {
      margin-top: 16px;
    }

    .signup input {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 300;
      color: #2f73f7;
      background: transparent;
      border: 0;
      font-size: clamp(16px, 5vw, 24px);
    }

    .signup input[type="email"] {
      padding: 6px 4px;
      border-bottom: 1px solid #2f73f7;
      width: 55%;
    }

    .signup input[type="submit"] {
      padding: 6px 12px;
      border: 1px solid #2f73f7;
      cursor: pointer;
      margin-left: 8px;
    }
  </style>
